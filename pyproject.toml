[project]
name = "windy-asr-app"
version = "0.1.0"
description = "Real-time ASR and Translation App using RealtimeSTT and Ollama"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "RealtimeSTT>=0.1.15",
    "customtkinter==5.2.2",
    "soundcard==0.4.5",
    "ollama>=0.1.6",
    "loguru>=0.7.2",
    "pyaudio>=0.2.14",
    "torch==2.5.1+cu121",
    "torchaudio==2.5.1+cu121",
    "requests>=2.32.5",
    "numpy==1.26.4",
    "Pillow>=11.0.0",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
